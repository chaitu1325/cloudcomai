name: HTML Deploy to GoDaddy

on:
  workflow_dispatch:

jobs:
  backup-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Upgraded to resolve Node 20 warning

      - name: Set up Node.js (For Backup Script)
        uses: actions/setup-node@v4 # Upgraded to resolve Node 20 warning
        with:
          node-version: 24 # Switched to Node 24 to match runner native runtime

      - name: Install Backup Tool Dependencies
        run: npm install

      - name: Run Safe Website Backup
        run: node backup.js
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Sync HTML Files to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ 
          server-dir: /public_html/
          dangerous-clean-html: true # FIXED: Changed from dangerous-clean-slate
          exclude: |
            .git/**
            .github/**
            node_modules/**
            package.json
            package-lock.json
            backup.js
